[package]
name = "ajo"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Rotating savings circles: unreviewed testnet prototype"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28"

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
